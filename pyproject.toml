[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpattern-fusion-ai"
version = "0.1.0"
description = "A Syntactic-Semantic Fusion Model for Detecting Dark-Pattern Cues in E-Commerce Interface Text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DarkPattern Fusion AI Research Team"}
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
